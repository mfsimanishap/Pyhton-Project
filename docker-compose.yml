
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tax-calculator-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/tax_calculator.db
      SECRET_KEY: ${SECRET_KEY:-development-secret-key-change-this-before-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - tax-calculator-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tax-calculator-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  tax-calculator-data:
